<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DexaFit Vancouver – New Client Special</title>
  <meta name="description" content="Get a DexaFit DEXA Scan for $127 – New Client Special at DexaFit Vancouver.">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">

</head>
<body class="funnel">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5QGRHDDQ"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <button type="button" class="back" id="backBtn" aria-label="Go back" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <img class="logo" src="assets/img/logo.svg" alt="DexaFit Vancouver">
    <div class="progress" id="progress" hidden aria-hidden="true"><span id="progressBar"></span></div>
  </header>

  <main class="page">
    <!-- Step 1: Intro -->
    <section class="step step--intro" data-step="intro">
      <h1>Get a DexaFit DEXA Scan for <s class="price-old">$159</s> <span class="price-new">$127</span>&nbsp;- New Client Special</h1>
      <p class="sub">Fill out a quick form, then pick your time on the next page.</p>
      <button type="button" class="btn btn--hero" data-next>
        Continue
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>

    <!-- Step 2: Name -->
    <form class="step" data-step="name" novalidate hidden>
      <h1>What's your first and last name?</h1>
      <div class="fields">
        <label class="field">
          <span class="icon" aria-hidden="true">👋</span>
          <input name="firstName" type="text" placeholder="Your first name" autocomplete="given-name" autocapitalize="words" enterkeyhint="next" aria-label="Your first name" required>
        </label>
        <label class="field">
          <span class="icon" aria-hidden="true">👋</span>
          <input name="lastName" type="text" placeholder="Your last name" autocomplete="family-name" autocapitalize="words" enterkeyhint="next" aria-label="Your last name" required>
        </label>
        <p class="error-msg" role="alert"></p>
        <button type="submit" class="btn">Next</button>
      </div>
      <!-- Spam trap: hidden from people, bots tend to fill it in. -->
      <input class="hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>

    <!-- Step 3: Email -->
    <form class="step" data-step="email" novalidate hidden>
      <h1>What's the best email we can send your new client special to?</h1>
      <div class="fields">
        <label class="field">
          <span class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
          </span>
          <input name="email" type="email" placeholder="Your email address" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" enterkeyhint="next" aria-label="Your email address" required>
        </label>
        <p class="error-msg" role="alert"></p>
        <button type="submit" class="btn">Next</button>
      </div>
    </form>

    <!-- Step 4: Phone + consent -->
    <form class="step" data-step="phone" novalidate hidden>
      <h1>What's the best way to reach you?</h1>
      <div class="fields">
        <div class="field">
          <label class="country" title="Country">
            <span class="flag" data-flag>🇺🇸</span>
            <svg class="chev" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="dial">+1</span>
            <select name="country" aria-label="Country code">
              <option value="CA" data-flag="🇨🇦">Canada (+1)</option>
              <option value="US" data-flag="🇺🇸" selected>United States (+1)</option>
            </select>
          </label>
          <input name="phone" type="tel" placeholder="Your phone number" autocomplete="tel-national" inputmode="tel" enterkeyhint="done" aria-label="Your phone number" required>
        </div>
        <p class="error-msg" role="alert"></p>

        <div class="checks">
          <label class="check">
            <input type="checkbox" name="privacyAccepted" required>
            <span>I have read and accept the <a href="privacy.html" target="_blank" rel="noopener">privacy policy.</a></span>
          </label>
          <label class="check">
            <input type="checkbox" name="smsConsent">
            <span>I agree to receive messages about exclusive offers from DexaFit Vancouver. Msg &amp; data rates may apply. Reply STOP to opt out at any time.</span>
          </label>
        </div>

        <button type="submit" class="btn">Submit and proceed</button>
      </div>
    </form>
  </main>

  <footer class="footer"><a href="privacy.html" target="_blank" rel="noopener">Privacy policy</a></footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/track.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/funnel.js"></script>
</body>
</html>
